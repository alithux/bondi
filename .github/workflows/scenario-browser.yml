name: BONDI rules lab browser checks
on:
  pull_request:
    paths:
      - 'dev/scenarios/**'
      - 'source-part-*.js'
      - 'game-engine.js'
      - 'multiplayer-core.js'
      - '.github/workflows/scenario-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node dev/scenarios/test.js
      - run: node dev/scenarios/browser.test.js
