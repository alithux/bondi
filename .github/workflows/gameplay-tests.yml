name: BONDI gameplay regression
on:
  push:
    branches: [ai/safer-post-bondi-leads]
  pull_request:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node home-contrast.test.js
      - run: node mobile-ux.test.js
      - run: node match-results-ui.test.js
      - run: node match-results.test.js
      - run: node multiplayer-ai-difficulty.test.js
      - run: node post-bondi-lead.test.js
      - run: node stage56.test.js
      - run: node multiplayer-lobby-refresh.test.js
      - run: node online-server/room-service.test.js
